<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DualSense Mobile • Connect</title>
    <style>
        :root {
            --bg-deep: #06080e;
            --surface-card: rgba(16, 24, 40, 0.85);
            --surface-border: rgba(0, 212, 255, 0.28);
            --accent-cyan: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.4);
            --accent-red: #ff0055;
            --accent-red-glow: rgba(255, 0, 85, 0.4);
            --accent-green: #00ff88;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background: radial-gradient(circle at 50% 15%, #111a33 0%, #06080e 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient aurora lights */
        .ambient-aurora {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        .lobby-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 640px;
            padding: 24px;
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .lobby-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Auto-Discovery Card */
        .discovery-card {
            background: rgba(10, 16, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .discovery-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radar-pulse {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse-cyan 1.6s infinite ease-out;
        }

        .radar-pulse.found {
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: none;
        }

        @keyframes pulse-cyan {
            0% { transform: scale(0.9); opacity: 1; box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            70% { transform: scale(1.1); opacity: 0.8; box-shadow: 0 0 0 12px rgba(0, 212, 255, 0); }
            100% { transform: scale(0.9); opacity: 1; box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }

        .discovery-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .discovery-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .discovery-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .quick-connect-btn {
            background: linear-gradient(135deg, #00d4ff, #0088ff);
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
            transition: all 0.2s;
            white-space: nowrap;
            display: none;
        }

        .quick-connect-btn:active {
            transform: scale(0.96);
        }

        /* Controls Section */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .ip-input-row {
            display: flex;
            gap: 8px;
        }

        .ip-input {
            flex: 1;
            background: rgba(8, 12, 22, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 14px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.2s;
        }

        .ip-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .port-input {
            width: 80px;
            background: rgba(8, 12, 22, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 14px;
            font-family: monospace;
            outline: none;
            text-align: center;
        }

        /* Slot Selector */
        .slot-selector {
            display: flex;
            gap: 10px;
        }

        .slot-pill {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            background: rgba(14, 20, 36, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot-pill.active-p1 {
            background: rgba(0, 212, 255, 0.15);
            border-color: var(--accent-cyan);
            color: #ffffff;
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .slot-pill.active-p2 {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 0 14px var(--accent-red-glow);
        }

        .slot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Big Connect Button */
        .btn-launch {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #00e5ff 0%, #0077fe 100%);
            color: #040814;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-launch:active {
            transform: scale(0.98);
        }

        .hotspot-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .hotspot-hint strong {
            color: var(--accent-cyan);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="ambient-aurora"></div>

    <div class="lobby-container">
        <div class="lobby-header">
            <div class="brand-badge">⚡ Wireless Gamepad Link</div>
            <div class="brand-title">DualSense Mobile</div>
            <div class="brand-subtitle">Connect phone to Windows PC or Console</div>
        </div>

        <!-- Auto Discovery Box -->
        <div class="discovery-card" id="discoveryBox">
            <div class="discovery-left">
                <div class="radar-pulse" id="radarIndicator"></div>
                <div class="discovery-text">
                    <div class="discovery-title" id="discoveryTitle">Searching for Host...</div>
                    <div class="discovery-desc" id="discoveryDesc">Scanning Wi-Fi & Hotspot network</div>
                </div>
            </div>
            <button class="quick-connect-btn" id="btnQuickConnect">CONNECT</button>
        </div>

        <!-- Manual IP Form -->
        <div class="controls-grid">
            <div class="input-group">
                <div class="input-label">PC IP Address & Port</div>
                <div class="ip-input-row">
                    <input type="text" id="ipInput" class="ip-input" placeholder="e.g. 192.168.1.100" />
                    <input type="text" id="portInput" class="port-input" value="8080" />
                </div>
            </div>

            <div class="input-group">
                <div class="input-label">Player Slot</div>
                <div class="slot-selector">
                    <div class="slot-pill active-p1" id="pillP1" onclick="selectSlot(1)">
                        <div class="slot-dot"></div>
                        Player 1 (Cyan)
                    </div>
                    <div class="slot-pill" id="pillP2" onclick="selectSlot(2)">
                        <div class="slot-dot"></div>
                        Player 2 (Red)
                    </div>
                </div>
            </div>

            <button class="btn-launch" id="btnConnect" onclick="launchController()">Launch Gamepad</button>

            <div class="hotspot-hint">
                Connected to PC Hotspot? Use <strong onclick="fillHotspotIP()">192.168.137.1</strong><br/>
                Ensure your phone and PC are on the same Wi-Fi.
            </div>
        </div>
    </div>

    <script>
        let currentSlot = 1;
        let discoveredIP = null;
        let discoveredPort = 8080;

        function selectSlot(slot) {
            currentSlot = slot;
            const p1 = document.getElementById('pillP1');
            const p2 = document.getElementById('pillP2');
            if (slot === 1) {
                p1.className = 'slot-pill active-p1';
                p2.className = 'slot-pill';
            } else {
                p1.className = 'slot-pill';
                p2.className = 'slot-pill active-p2';
            }
        }

        function fillHotspotIP() {
            document.getElementById('ipInput').value = '192.168.137.1';
            document.getElementById('portInput').value = '8080';
        }

        // Called from Android Java when host responds to UDP ping
        window.onHostDiscovered = function(ip, port) {
            discoveredIP = ip;
            discoveredPort = port || 8080;

            const radar = document.getElementById('radarIndicator');
            const title = document.getElementById('discoveryTitle');
            const desc = document.getElementById('discoveryDesc');
            const btn = document.getElementById('btnQuickConnect');

            radar.className = 'radar-pulse found';
            title.innerText = 'Host PC Discovered!';
            desc.innerText = `${ip}:${discoveredPort}`;

            btn.style.display = 'block';
            btn.onclick = function() {
                document.getElementById('ipInput').value = discoveredIP;
                document.getElementById('portInput').value = discoveredPort;
                launchController();
            };

            // Pre-fill input if empty
            const ipInput = document.getElementById('ipInput');
            if (!ipInput.value || ipInput.value === '192.168.137.1' || ipInput.value === '127.0.0.1') {
                ipInput.value = ip;
            }
        };

        function launchController() {
            const ip = document.getElementById('ipInput').value.trim();
            const port = document.getElementById('portInput').value.trim() || '8080';

            if (!ip) {
                alert('Please enter your PC IP address or wait for auto-discovery.');
                return;
            }

            if (window.AndroidNative && window.AndroidNative.connect) {
                window.AndroidNative.connect(ip, port, currentSlot);
            } else {
                window.location.href = `http://${ip}:${port}/controller?slot=${currentSlot}`;
            }
        }

        // Initialize saved state from Android
        window.addEventListener('DOMContentLoaded', () => {
            if (window.AndroidNative && window.AndroidNative.getLastHost) {
                const saved = window.AndroidNative.getLastHost();
                if (saved) {
                    document.getElementById('ipInput').value = saved;
                }
            }
            if (window.AndroidNative && window.AndroidNative.getLastSlot) {
                const s = window.AndroidNative.getLastSlot();
                if (s === 2) selectSlot(2);
            }
            if (window.AndroidNative && window.AndroidNative.startAutoDiscovery) {
                window.AndroidNative.startAutoDiscovery();
            }
        });
    </script>
</body>
</html>
