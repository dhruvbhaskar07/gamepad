<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1100" height="280" fill="#080c16" rx="14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Connecting Data Pipes (Input Stream: Left to Right) -->
  <line x1="240" y1="110" x2="370" y2="110" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="370,110 360,105 360,115" fill="#00f0ff"/>
  
  <line x1="580" y1="110" x2="710" y2="110" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="710,110 700,105 700,115" fill="#00f0ff"/>

  <line x1="920" y1="110" x2="980" y2="110" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="980,110 970,105 970,115" fill="#00f0ff"/>

  <!-- Flow labels Top -->
  <text x="305" y="96" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="10" font-weight="800" text-anchor="middle">11-BYTE BINARY PACKET</text>
  <text x="645" y="96" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="10" font-weight="800" text-anchor="middle">KERNEL IOCTL</text>

  <!-- Connecting Data Pipes (Rumble Stream: Right to Left) -->
  <line x1="980" y1="170" x2="580" y2="170" stroke="#ff007f" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="580,170 590,165 590,175" fill="#ff007f"/>

  <line x1="370" y1="170" x2="240" y2="170" stroke="#ff007f" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="240,170 250,165 250,175" fill="#ff007f"/>

  <!-- Flow labels Bottom -->
  <text x="645" y="192" fill="#ff007f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="10" font-weight="800" text-anchor="middle">&#9664; LIVE GAME FORCE FEEDBACK RUMBLE TELEMETRY</text>

  <!-- Node 1: Mobile Controller -->
  <g transform="translate(30, 50)">
    <rect width="210" height="175" rx="12" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <text x="25" y="38" font-size="22">&#128241;</text>
    <text x="60" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800">Mobile Phone</text>
    <text x="60" y="48" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">iOS / Android Web</text>
    <line x1="15" y1="65" x2="195" y2="65" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; Touch / Gyro POV Sensor</text>
    <text x="18" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; WebSocket + UDP 9050</text>
    <text x="18" y="134" fill="#00e676" font-family="monospace" font-size="10" font-weight="800">&bull; Latency: &lt; 2.0 ms (120FPS)</text>
    <text x="18" y="154" fill="#ffd600" font-family="sans-serif" font-size="10" font-weight="600">&bull; Speaker-Coil + Actuator</text>
  </g>

  <!-- Node 2: Go Backend Server -->
  <g transform="translate(370, 50)">
    <rect width="210" height="175" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="38" font-size="22">&#9889;</text>
    <text x="60" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800">DualSense Server</text>
    <text x="60" y="48" fill="#00e676" font-family="monospace" font-size="10" font-weight="700">Golang 1.20+ Engine</text>
    <line x1="15" y1="65" x2="195" y2="65" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; Zero-Alloc Binary Decoder</text>
    <text x="18" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; 2-Player Slot Multiplexer</text>
    <text x="18" y="134" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; Windows Mobile Hotspot</text>
    <text x="18" y="154" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">&bull; Embedded Standalone Exe</text>
  </g>

  <!-- Node 3: ViGEm Kernel Driver -->
  <g transform="translate(710, 50)">
    <rect width="210" height="175" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="25" y="38" font-size="22">&#128268;</text>
    <text x="60" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800">ViGEmBus Driver</text>
    <text x="60" y="48" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">Windows Kernel Level</text>
    <line x1="15" y1="65" x2="195" y2="65" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; Native XInput / DirectInput</text>
    <text x="18" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; Virtual Xbox 360 / DS4</text>
    <text x="18" y="134" fill="#00e676" font-family="monospace" font-size="10" font-weight="800">&bull; 0ms Driver Overhead</text>
    <text x="18" y="154" fill="#ff007f" font-family="sans-serif" font-size="10" font-weight="600">&bull; Real Motor Rumble Callbacks</text>
  </g>

  <!-- Node 4: Games & Emulators -->
  <g transform="translate(980, 68)">
    <rect width="105" height="140" rx="10" fill="#020617" stroke="#00e676" stroke-width="2"/>
    <text x="52" y="36" font-size="24" text-anchor="middle">&#127918;</text>
    <text x="52" y="62" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">PC GAMES</text>
    <text x="52" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Steam / Epic</text>
    <text x="52" y="103" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Tekken / Forza</text>
    <text x="52" y="122" fill="#00e676" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">RPCS3 / Yuzu</text>
  </g>
</svg>
