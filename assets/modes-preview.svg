<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardPS5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1a38"/>
      <stop offset="100%" stop-color="#060c1c"/>
    </linearGradient>

    <linearGradient id="cardXbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2e14"/>
      <stop offset="100%" stop-color="#06160a"/>
    </linearGradient>

    <linearGradient id="cardFight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#362208"/>
      <stop offset="100%" stop-color="#1c1003"/>
    </linearGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .anim-mode { animation: floatSlow 4s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="1100" height="320" fill="#05070d" rx="14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ================= MODE 1: PS5 DUALSENSE ================= -->
  <g transform="translate(30, 20)">
    <rect width="320" height="280" rx="14" fill="url(#cardPS5)" stroke="#00d4ff" stroke-width="1.8" stroke-opacity="0.6"/>
    <!-- Header -->
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(0, 212, 255, 0.2)"/>
    <text x="39" y="45" font-size="20" text-anchor="middle">🎮</text>
    <text x="68" y="38" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">PS5 DualSense</text>
    <text x="68" y="54" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">GLACIER BLUE AESTHETIC</text>

    <!-- Visual Mini Diagram -->
    <g transform="translate(160, 110)">
      <!-- Gamepad Outline -->
      <path d="M-80,20 C-95,-10 -75,-35 -35,-40 C-15,-42 15,-42 35,-40 C75,-35 95,-10 80,20 C70,35 55,42 45,30 C35,16 20,16 0,16 C-20,16 -35,16 -45,30 C-55,42 -70,35 -80,20 Z"
            fill="#111c33" stroke="#00d4ff" stroke-width="1.5"/>
      <!-- Symmetrical Thumbsticks -->
      <circle cx="-25" cy="5" r="10" fill="#1e293b" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="25" cy="5" r="10" fill="#1e293b" stroke="#00d4ff" stroke-width="1"/>
      <!-- Touchpad -->
      <rect x="-20" y="-30" width="40" height="18" rx="3" fill="#070c17" stroke="#38bdf8" stroke-width="1"/>
      <!-- Face Buttons -->
      <circle cx="50" cy="-14" r="3" fill="#00d4ff"/>
      <circle cx="58" cy="-6" r="3" fill="#ff007f"/>
      <circle cx="50" cy="2" r="3" fill="#38bdf8"/>
      <circle cx="42" cy="-6" r="3" fill="#ec4899"/>
    </g>

    <!-- Key Features -->
    <line x1="20" y1="160" x2="300" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="186" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; Symmetrical Analog Thumbsticks (L3/R3)</text>
    <text x="24" y="208" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; Touchpad Free-Look &amp; Map Click</text>
    <text x="24" y="230" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; Pro Back Paddles M1 &amp; M2</text>
    <text x="24" y="252" fill="#00d4ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&bull; Best for: Action, Racing, GTA, FIFA</text>
  </g>

  <!-- ================= MODE 2: XBOX SERIES X ================= -->
  <g transform="translate(390, 20)">
    <rect width="320" height="280" rx="14" fill="url(#cardXbox)" stroke="#00ff66" stroke-width="1.8" stroke-opacity="0.6"/>
    <!-- Header -->
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(0, 255, 102, 0.2)"/>
    <text x="39" y="45" font-size="20" text-anchor="middle">🕹️</text>
    <text x="68" y="38" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Xbox Series X</text>
    <text x="68" y="54" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TOXIC NEON CARBON</text>

    <!-- Visual Mini Diagram -->
    <g transform="translate(160, 110)">
      <!-- Gamepad Outline -->
      <path d="M-80,20 C-95,-10 -75,-35 -35,-40 C-15,-42 15,-42 35,-40 C75,-35 95,-10 80,20 C70,35 55,42 45,30 C35,16 20,16 0,16 C-20,16 -35,16 -45,30 C-55,42 -70,35 -80,20 Z"
            fill="#0f2214" stroke="#00ff66" stroke-width="1.5"/>
      <!-- Offset Thumbsticks -->
      <circle cx="-50" cy="-12" r="10" fill="#1e293b" stroke="#00ff66" stroke-width="1"/>
      <circle cx="25" cy="5" r="10" fill="#1e293b" stroke="#00ff66" stroke-width="1"/>
      <!-- Nexus Xbox Button -->
      <circle cx="0" cy="-20" r="7" fill="#00ff66" filter="drop-shadow(0 0 6px #00ff66)"/>
      <!-- Face Buttons A/B/X/Y -->
      <circle cx="50" cy="-18" r="3" fill="#ffd600"/>
      <circle cx="58" cy="-10" r="3" fill="#ff0055"/>
      <circle cx="50" cy="-2" r="3" fill="#00ff66"/>
      <circle cx="42" cy="-10" r="3" fill="#00d4ff"/>
    </g>

    <!-- Key Features -->
    <line x1="20" y1="160" x2="300" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="186" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; Offset Asymmetrical Thumbsticks</text>
    <text x="24" y="208" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; LB, LT, RB, RT Analog Triggers</text>
    <text x="24" y="230" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; Native Xbox 360 Controller Protocol</text>
    <text x="24" y="252" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&bull; Best for: FPS, COD, Forza, Halo</text>
  </g>

  <!-- ================= MODE 3: SANWA FIGHTSTICK ================= -->
  <g transform="translate(750, 20)">
    <rect width="320" height="280" rx="14" fill="url(#cardFight)" stroke="#ffb703" stroke-width="1.8" stroke-opacity="0.6"/>
    <!-- Header -->
    <rect x="20" y="20" width="38" height="38" rx="8" fill="rgba(255, 183, 3, 0.2)"/>
    <text x="39" y="45" font-size="20" text-anchor="middle">⚡</text>
    <text x="68" y="38" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Arcade Fightstick</text>
    <text x="68" y="54" fill="#ffb703" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SANWA GOLD &amp; HITBOX</text>

    <!-- Visual Mini Diagram -->
    <g transform="translate(160, 110)">
      <!-- Arcade Panel Outline -->
      <rect x="-85" y="-35" width="170" height="70" rx="6" fill="#201305" stroke="#ffb703" stroke-width="1.5"/>
      <!-- Joystick Ball Top -->
      <circle cx="-50" cy="0" r="12" fill="#ff0055" stroke="#ffb703" stroke-width="1.5"/>
      <!-- 8-Button Vewlix Layout -->
      <circle cx="5" cy="-14" r="5" fill="#38bdf8"/>
      <circle cx="20" cy="-16" r="5" fill="#ffd600"/>
      <circle cx="35" cy="-14" r="5" fill="#ff0055"/>
      <circle cx="50" cy="-10" r="5" fill="#a855f7"/>

      <circle cx="5" cy="8" r="5" fill="#38bdf8"/>
      <circle cx="20" cy="6" r="5" fill="#ffd600"/>
      <circle cx="35" cy="8" r="5" fill="#ff0055"/>
      <circle cx="50" cy="12" r="5" fill="#a855f7"/>
    </g>

    <!-- Key Features -->
    <line x1="20" y1="160" x2="300" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="186" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; 8-Button Japanese Arcade Vewlix Setup</text>
    <text x="24" y="208" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; 1-Tap Toggle: Sanwa Stick &harr; Hitbox</text>
    <text x="24" y="230" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">&bull; Dedicated Macros: Throw, Parry, EX</text>
    <text x="24" y="252" fill="#ffb703" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&bull; Best for: Tekken 8, Street Fighter 6, MK</text>
  </g>
</svg>
