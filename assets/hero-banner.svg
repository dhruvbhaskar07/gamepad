<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <radialGradient id="auroraCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0077ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPink" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(8deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-10deg); }
      }
      @keyframes lightbarShimmer {
        0%, 100% { filter: drop-shadow(0 0 10px #00f0ff); stroke: #00f0ff; }
        33% { filter: drop-shadow(0 0 14px #a855f7); stroke: #a855f7; }
        66% { filter: drop-shadow(0 0 12px #ff007f); stroke: #ff007f; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gridDrift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      .anim-lightbar { animation: lightbarShimmer 6s infinite ease-in-out; }
      .anim-pulse { animation: pulseGlow 3s infinite ease-in-out; }
      .anim-float1 { animation: floatSlow 5s infinite ease-in-out; }
      .anim-float2 { animation: floatFast 4s infinite ease-in-out; }
      .anim-float3 { animation: floatSlow 6s infinite ease-in-out; }
      .grid-line { stroke: rgba(0, 240, 255, 0.08); stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#auroraCyan)" rx="16"/>
  <rect width="1200" height="420" fill="url(#auroraPink)" rx="16"/>

  <!-- Cyber Grid Horizon -->
  <g opacity="0.45">
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="0" y1="380" x2="1200" y2="380" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00f0ff" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Perspective rays -->
    <line x1="600" y1="360" x2="0" y2="420" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="600" y1="360" x2="200" y2="420" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="600" y1="360" x2="400" y2="420" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="600" y1="360" x2="800" y2="420" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="600" y1="360" x2="1000" y2="420" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="600" y1="360" x2="1200" y2="420" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Floating Glowing PlayStation / Xbox Symbols -->
  <g class="anim-float1">
    <polygon points="130,110 145,135 115,135" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
  </g>
  <g class="anim-float2">
    <circle cx="1060" cy="120" r="14" fill="none" stroke="#ff007f" stroke-width="3" filter="url(#glowPink)"/>
  </g>
  <g class="anim-float3">
    <rect x="180" y="240" width="22" height="22" rx="4" fill="none" stroke="#a855f7" stroke-width="3"/>
  </g>
  <g class="anim-float1">
    <line x1="1000" y1="230" x2="1024" y2="254" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="1024" y1="230" x2="1000" y2="254" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="anim-float2">
    <text x="80" y="290" fill="#ffd600" font-family="sans-serif" font-weight="900" font-size="24">⚡</text>
  </g>
  <g class="anim-float3">
    <text x="1100" y="280" fill="#00f0ff" font-family="sans-serif" font-weight="900" font-size="24">✦</text>
  </g>

  <!-- Central Futuristic DualSense Controller Silhouette Visual -->
  <g transform="translate(600, 155) scale(0.95)" text-anchor="middle">
    <!-- Outer Glow Silhouette -->
    <path d="M-150,40 C-180,-10 -150,-60 -70,-70 C-30,-75 30,-75 70,-70 C150,-60 180,-10 150,40 C135,65 110,80 90,55 C70,30 45,30 30,30 C15,30 -15,30 -30,30 C-45,30 -70,30 -90,55 C-110,80 -135,65 -150,40 Z"
          fill="url(#padGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.8))"/>

    <!-- Lightbar Glowing Arc -->
    <path d="M-55,-40 Q0,-50 55,-40" fill="none" stroke-width="4.5" stroke-linecap="round" class="anim-lightbar"/>

    <!-- Touchpad Outline -->
    <rect x="-42" y="-45" width="84" height="42" rx="6" fill="#0b1120" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5"/>

    <!-- D-Pad Left -->
    <g transform="translate(-85, -20)">
      <rect x="-8" y="-22" width="16" height="44" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="-22" y="-8" width="44" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    </g>

    <!-- Action Buttons Right (▲, ●, ✖, ■) -->
    <g transform="translate(85, -20)">
      <!-- Top Triangle -->
      <circle cx="0" cy="-14" r="6.5" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2"/>
      <!-- Right Circle -->
      <circle cx="14" cy="0" r="6.5" fill="#1e293b" stroke="#ff007f" stroke-width="1.2"/>
      <!-- Bottom Cross -->
      <circle cx="0" cy="14" r="6.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <!-- Left Square -->
      <circle cx="-14" cy="0" r="6.5" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    </g>

    <!-- Dual Clickable Thumbsticks -->
    <g transform="translate(-40, 18)">
      <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" filter="drop-shadow(0 0 6px rgba(0,240,255,0.4))"/>
    </g>
    <g transform="translate(40, 18)">
      <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#ff007f" stroke-width="1.5" filter="drop-shadow(0 0 6px rgba(255,0,127,0.4))"/>
    </g>

    <!-- PS Home Logo Button -->
    <circle cx="0" cy="10" r="7" fill="#0284c7" filter="drop-shadow(0 0 6px #00f0ff)"/>
  </g>

  <!-- Typography Content Header -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 48)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.2"/>
      <circle cx="-115" cy="0" r="4.5" fill="#00e676" class="anim-pulse"/>
      <text x="-95" y="4.5" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ZERO-LATENCY VIRTUAL GAMEPAD</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="275" fill="url(#textGrad)" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="2">
      DUALSENSE MOBILE STUDIO
    </text>

    <!-- Subtitle -->
    <text x="600" y="308" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.5">
      Turn Any Smartphone into a Pro Virtual Controller for Windows PC &bull; 60–120 FPS
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(600, 345)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700">
      <rect x="-370" y="-12" width="135" height="24" rx="12" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1"/>
      <text x="-302" y="4" fill="#00f0ff">🎮 PS5 DUALSENSE</text>

      <rect x="-220" y="-12" width="145" height="24" rx="12" fill="rgba(0, 255, 102, 0.12)" stroke="#00ff66" stroke-width="1"/>
      <text x="-148" y="4" fill="#00ff66">🕹️ XBOX SERIES X</text>

      <rect x="-60" y="-12" width="150" height="24" rx="12" fill="rgba(255, 183, 3, 0.12)" stroke="#ffb703" stroke-width="1"/>
      <text x="15" y="4" fill="#ffb703">⚡ SANWA FIGHTSTICK</text>

      <rect x="105" y="-12" width="125" height="24" rx="12" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1"/>
      <text x="168" y="4" fill="#a855f7">🎯 GYRO POV AIM</text>

      <rect x="245" y="-12" width="125" height="24" rx="12" fill="rgba(255, 0, 127, 0.12)" stroke="#ff007f" stroke-width="1"/>
      <text x="308" y="4" fill="#ff007f">📳 DUAL RUMBLE</text>
    </g>
  </g>
</svg>
